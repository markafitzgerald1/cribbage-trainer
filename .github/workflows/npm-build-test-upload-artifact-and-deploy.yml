name: npm-build-test-upload-artifact-and-deploy
on:
  # push is the production trigger only. A feature-branch push starts no run,
  # so it can never be cancelled by the pull_request run that follows it and
  # leave an orphan CANCELLED build-and-test check-run that blocks merge
  # (#786). Everything for a branch runs on pull_request instead. A branch
  # pushed without an open PR gets no CI — the flow (AGENTS.md) opens the PR
  # immediately, and a PR-less branch cannot merge anyway.
  push:
    branches: [main]
  # opened/reopened give a new PR its checks and preview at once; synchronize
  # covers every later push to the PR head (a fork push, which fires no push
  # event here, included).
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  # push (main only) keys on "main-deploy"; a pull_request keys on
  # branch-<head repo>-<branch>. The two spaces cannot intersect — the
  # "branch-" prefix is unreachable by any ref name, so a fork PR from a
  # branch called "main" gets branch-<fork>/cribbage-trainer-main and cannot
  # cancel a production deploy. Namespacing on the head repo also keeps two
  # fork PRs that share a branch name from cancelling each other's run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main-deploy' || format('branch-{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Run pages-content merge logic tests
        run: npm run test:pages-content-merge

      # The Dockerfile copies an allowlist that excludes the vendor skill
      # symlinks, so this guard can only run outside the image.
      - name: Run skill path symlink tests
        run: npm run test:skill-paths

      # Guards the lint:audit wrapper that keeps a npm.org audit-endpoint
      # outage from failing this job; pure logic, no network, so it runs here.
      - name: Run lint:audit wrapper tests
        run: npm run test:lint-audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Test Image (unit tests, lint, Storybook tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cribbage-trainer-integration-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E Tests in Docker
        run: npm run docker:run-e2e-only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  build-upload-and-deploy:
    runs-on: ubuntu-latest
    # event_name pinned so a future trigger addition cannot let the
    # production deploy run on anything but a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Shared across every job that publishes to Pages so a production
    # deploy and a PR preview deploy can never race on the pages-content
    # state branch (see .github/actions/publish-pages-content).
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    # and to push the pages-content state branch.
    permissions:
      contents: write # to push the pages-content state branch
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      pull-requests: read # to list open PRs when pruning stale previews

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and cache npm dependencies
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm clean-install

      - name: Cache build outputs (dist directory)
        id: cache-dist
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles(
            'package-lock.json',
            '.nvmrc',
            'src/**/*',
            'styles.d.ts',
            '.storybook/main.ts',
            '.storybook/preview.ts',
            'vite.config.js',
            'tsconfig.json',
            'babel.config.js'
            ) }}
          restore-keys: |
            ${{ runner.os }}-dist-

      - name: Build web application bundles
        if: steps.cache-dist.outputs.cache-hit != 'true'
        run: npm run build
        env:
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}

      - name: Build static Storybook site
        if: steps.cache-dist.outputs.cache-hit != 'true'
        run: npm run storybook:build

      # Merged PRs get no close-event cleanup (it would race this very
      # deploy in the pages-deploy concurrency group and GitHub cancels the
      # older waiting job), so production publishes prune stale previews.
      - id: open-prs
        name: List open pull request numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t OPEN_PR_NUMBERS < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[].number'
          )
          if ((${#OPEN_PR_NUMBERS[@]} == 0)); then
            echo "list=none" >> "$GITHUB_OUTPUT"
          else
            echo "list=${OPEN_PR_NUMBERS[*]}" >> "$GITHUB_OUTPUT"
          fi

      - id: publish
        name: Publish production content and deploy
        uses: ./.github/actions/publish-pages-content
        with:
          merge-args: prod dist
          commit-message: Publish production content
          prune-keep-prs: ${{ steps.open-prs.outputs.list }}

  resolve-preview-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      number: ${{ steps.resolve.outputs.number }}
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - id: resolve
        name: Resolve whether this PR is eligible for a preview
        env:
          # From the payload rather than inlined into the script (actionlint
          # script-injection check). This job only runs on pull_request.
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          NUMBER="$PR_EVENT_NUMBER"
          # The same bot is app/dependabot in gh CLI/GraphQL output but
          # dependabot[bot] in REST event payloads; match both spellings.
          case "$PR_EVENT_AUTHOR" in
            "dependabot[bot]" | "app/dependabot") DEPENDABOT=true ;;
            *) DEPENDABOT=false ;;
          esac
          if [ "$PR_EVENT_HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$DEPENDABOT" = "true" ]; then
            echo "Pull request #$NUMBER is from a fork or Dependabot; skipping preview deploy."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "eligible=true"
            echo "number=$NUMBER"
            echo "url=https://markafitzgerald1.github.io/cribbage-trainer/pr/$NUMBER/"
          } >> "$GITHUB_OUTPUT"

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build-and-test, resolve-preview-pr]
    if: github.event_name == 'pull_request' && needs.resolve-preview-pr.outputs.eligible == 'true'

    # Shared with build-upload-and-deploy; see that job's comment.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    permissions:
      contents: write # to push the pages-content state branch
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      pull-requests: read # to recheck the PR is still open before publishing

    # A separate, unprotected environment from github-pages: that
    # environment's branch policy permits deployments only from main.
    environment:
      name: github-pages-preview
      url: ${{ needs.resolve-preview-pr.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and cache npm dependencies
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm clean-install

      - name: Build web application bundle for this preview
        run: npm run build
        env:
          PAGES_BASE_PATH: /cribbage-trainer/pr/${{ needs.resolve-preview-pr.outputs.number }}
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}

      # The eligibility check ran before the ~6-minute build-and-test gate;
      # if the PR closed in that window, publishing would recreate a preview
      # that the cleanup workflow already removed (or is about to remove).
      - id: recheck
        name: Confirm the pull request is still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh pr view "${{ needs.resolve-preview-pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
          if [ "$STATE" = "OPEN" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pull request #${{ needs.resolve-preview-pr.outputs.number }} is $STATE; skipping preview publish."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish preview content and deploy
        if: steps.recheck.outputs.open == 'true'
        uses: ./.github/actions/publish-pages-content
        with:
          merge-args: pr ${{ needs.resolve-preview-pr.outputs.number }} dist
          commit-message: Publish pr/${{ needs.resolve-preview-pr.outputs.number }} preview
