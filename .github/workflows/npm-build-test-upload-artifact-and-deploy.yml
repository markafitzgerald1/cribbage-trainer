name: npm-build-test-upload-artifact-and-deploy
on:
  # push is the production trigger only. A feature-branch push starts no run,
  # so it can never be cancelled by the pull_request run that follows it and
  # leave an orphan CANCELLED build-and-test check-run that blocks merge
  # (#786). Everything for a branch runs on pull_request instead. A branch
  # pushed without an open PR gets no CI — the flow (AGENTS.md) opens the PR
  # immediately, and a PR-less branch cannot merge anyway.
  push:
    branches: [main]
  # opened/reopened give a new PR its checks and preview at once; synchronize
  # covers every later push to the PR head (a fork push, which fires no push
  # event here, included).
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  # push (main only) keys on "main-deploy"; a pull_request keys on
  # branch-<head repo>-<branch>. The two spaces cannot intersect — the
  # "branch-" prefix is unreachable by any ref name, so a fork PR from a
  # branch called "main" gets branch-<fork>/cribbage-trainer-main and cannot
  # cancel a production deploy. Namespacing on the head repo also keeps two
  # fork PRs that share a branch name from cancelling each other's run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main-deploy' || format('branch-{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  docker-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Run pages-content merge logic tests
        run: npm run test:pages-content-merge

      # The Dockerfile copies an allowlist that excludes the vendor skill
      # symlinks, so this guard can only run outside the image.
      - name: Run skill path symlink tests
        run: npm run test:skill-paths

      # Guards the lint:audit wrapper that keeps a npm.org audit-endpoint
      # outage from failing this job; pure logic, no network, so it runs here.
      - name: Run lint:audit wrapper tests
        run: npm run test:lint-audit

      # The size gate's own measurement logic. Pure parsing and arithmetic
      # over git output, so it runs here rather than in the Docker gate, whose
      # COPY allowlist excludes scripts/ before the test layer.
      - name: Run pull request size gate tests
        run: npm run test:pr-size-gate

      # Each vendored means table and its uncertainty sidecar are a matched
      # pair: the sidecar names the means bytes it was exported against.
      # Nothing else notices a mismatch, because both files still parse. Runs
      # here rather than in the Docker gate, whose COPY allowlist excludes
      # scripts/ before the test layer.
      - name: Run vendored expected-points table tests
        run: npm run test:vendored-tables

      # Guards the PWA manifest JSON schema, icon presence, and HTML linkage.
      # Runs here rather than in the Docker gate, whose COPY allowlist
      # excludes scripts/ before the test layer.
      - name: Run PWA manifest tests
        run: npm run test:pwa-manifest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No load: e2e runs in the shard jobs below, so nothing here needs the
      # image in the daemon, and exporting it cost ~95 s per run. No cache-to
      # either: on #954 a pull request's import hit only layers main also
      # had, never its own earlier export, even on a rerun of the same head.
      # Exporting cost 14-18 s per run and filled the repository's
      # 10 GB cache, which evicts the main layers warm-docker-cache writes.
      - name: Build Docker Test Image (unit tests, lint, Storybook tests)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cribbage-trainer-integration-tests:latest
          cache-from: type=gha

  e2e-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Main needs it too, for warm-e2e-npm-cache.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.from.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Screenshot baselines are rendered in the Dockerfile's base image, so
      # the shards must run in exactly that image. Dependabot's
      # playwright-sync group bumps the Dockerfile but not this workflow, so
      # the tag is read from the Dockerfile rather than repeated here.
      - id: from
        name: Read the Playwright base image from the Dockerfile
        run: |
          IMAGE=$(awk '$1 == "FROM" { print $2; exit }' Dockerfile)
          case "$IMAGE" in
            mcr.microsoft.com/playwright:*) ;;
            *)
              echo "Unexpected base image: '$IMAGE'" >&2
              exit 1
              ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: e2e-image
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    container:
      image: ${{ needs.e2e-image.outputs.image }}
      # Playwright's CI guidance: Firefox refuses to run as root under a HOME
      # owned by another user, and the runner mounts HOME as uid 1001.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Report runner CPU count
        run: nproc

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-e2e-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-npm-

      - name: Install dependencies
        run: npm clean-install

      # Shards are contiguous blocks of a list ordered by project, and a
      # WebKit test costs about 2.7x a Chromium one, so equal counts left the
      # WebKit and Mobile Safari shards up to twice as slow as the average.
      # These relative weights were fitted to measured durations (#949); they
      # sum to the 667 tests of the time, so each is that shard's count. They
      # only move block boundaries, so every test, new ones included, falls in
      # exactly one shard; an unset variable falls back to equal blocks.
      # There must be one weight per shard: changing the matrix without
      # changing this list fails every shard.
      - name: Run E2E shard ${{ matrix.shard }} of 8
        env:
          PWTEST_SHARD_WEIGHTS: "146:99:57:64:108:95:58:40"
        run: npx playwright test --shard=${{ matrix.shard }}/8 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  merge-e2e-reports:
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js and cache npm dependencies
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm clean-install

      - name: Download shard blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # The required check. It only aggregates, so the context branch protection
  # keys on keeps its name. A required check that is skipped counts as
  # passing, so this job must never be skipped on a pull request: always(),
  # not !cancelled(), or cancelling a head's run would leave it green. Every
  # result is then checked explicitly, so a cancelled or skipped gate job
  # fails it. A run cancelled by a newer push fails only on the superseded
  # SHA, which nothing merges. The report merge is left out on purpose:
  # reporting must not decide the gate.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [docker-gate, e2e-image, e2e]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions: {}
    steps:
      - name: Require every gate job to have succeeded
        env:
          DOCKER_GATE: ${{ needs.docker-gate.result }}
          E2E_IMAGE: ${{ needs.e2e-image.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "docker-gate=$DOCKER_GATE e2e-image=$E2E_IMAGE e2e=$E2E"
          [ "$DOCKER_GATE" = success ] && [ "$E2E_IMAGE" = success ] && [ "$E2E" = success ]

  # A pull request can read only its own cache and its base branch's (main
  # for every pull request here). Without this job main never writes the
  # Docker layers, so every pull request's first run built from nothing and
  # spent ~166 s exporting them. Its result decides nothing; deploy does not
  # wait on it.
  warm-docker-cache:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Test Image into the cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The npm cache counterpart of warm-docker-cache: the e2e shards run only
  # on pull requests, so without this main never writes their ~/.npm entry
  # and every pull request's first run installs cold. The container, user,
  # path and key must match the e2e job exactly, or the entry it saves is
  # one the shards cannot restore. Its result decides nothing.
  warm-e2e-npm-cache:
    runs-on: ubuntu-latest
    needs: e2e-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    container:
      image: ${{ needs.e2e-image.outputs.image }}
      options: --user 1001
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - id: cache
        name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-e2e-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-npm-

      - name: Install dependencies into the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm clean-install

  build-upload-and-deploy:
    runs-on: ubuntu-latest
    # event_name pinned so a future trigger addition cannot let the
    # production deploy run on anything but a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Shared across every job that publishes to Pages so a production
    # deploy and a PR preview deploy can never race on the pages-content
    # state branch (see .github/actions/publish-pages-content).
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    # and to push the pages-content state branch.
    permissions:
      contents: write # to push the pages-content state branch
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      pull-requests: read # to list open PRs when pruning stale previews

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js and cache npm dependencies
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm clean-install

      # build-and-test is gated to pull_request, so this is the only place a
      # push to main is checked. A vendored means table and uncertainty
      # sidecar that do not belong together still parse and still render, so
      # without this the production deploy is the one path that ships a
      # mismatched pair without noticing. Both pairs are checked.
      - name: Run vendored expected-points table tests
        run: npm run test:vendored-tables

      - name: Cache build outputs (dist directory)
        id: cache-dist
        uses: actions/cache@v5
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles(
            'package-lock.json',
            '.nvmrc',
            'src/**/*',
            'styles.d.ts',
            '.storybook/main.ts',
            '.storybook/preview.ts',
            'vite.config.mjs',
            'tsconfig.json',
            'babel.config.json'
            ) }}
          restore-keys: |
            ${{ runner.os }}-dist-

      - name: Build web application bundles
        if: steps.cache-dist.outputs.cache-hit != 'true'
        run: npm run build
        env:
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}

      - name: Build static Storybook site
        if: steps.cache-dist.outputs.cache-hit != 'true'
        run: npm run storybook:build

      # Merged PRs get no close-event cleanup (it would race this very
      # deploy in the pages-deploy concurrency group and GitHub cancels the
      # older waiting job), so production publishes prune stale previews.
      - id: open-prs
        name: List open pull request numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t OPEN_PR_NUMBERS < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[].number'
          )
          if ((${#OPEN_PR_NUMBERS[@]} == 0)); then
            echo "list=none" >> "$GITHUB_OUTPUT"
          else
            echo "list=${OPEN_PR_NUMBERS[*]}" >> "$GITHUB_OUTPUT"
          fi

      - id: publish
        name: Publish production content and deploy
        uses: ./.github/actions/publish-pages-content
        with:
          merge-args: prod dist
          commit-message: Publish production content
          prune-keep-prs: ${{ steps.open-prs.outputs.list }}

  resolve-preview-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      number: ${{ steps.resolve.outputs.number }}
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - id: resolve
        name: Resolve whether this PR is eligible for a preview
        env:
          # From the payload rather than inlined into the script (actionlint
          # script-injection check). This job only runs on pull_request.
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          NUMBER="$PR_EVENT_NUMBER"
          # The same bot is app/dependabot in gh CLI/GraphQL output but
          # dependabot[bot] in REST event payloads; match both spellings.
          case "$PR_EVENT_AUTHOR" in
            "dependabot[bot]" | "app/dependabot") DEPENDABOT=true ;;
            *) DEPENDABOT=false ;;
          esac
          if [ "$PR_EVENT_HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$DEPENDABOT" = "true" ]; then
            echo "Pull request #$NUMBER is from a fork or Dependabot; skipping preview deploy."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "eligible=true"
            echo "number=$NUMBER"
            echo "url=https://markafitzgerald1.github.io/cribbage-trainer/pr/$NUMBER/"
          } >> "$GITHUB_OUTPUT"

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build-and-test, resolve-preview-pr]
    if: github.event_name == 'pull_request' && needs.resolve-preview-pr.outputs.eligible == 'true'

    # Shared with build-upload-and-deploy; see that job's comment.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    permissions:
      contents: write # to push the pages-content state branch
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      pull-requests: read # to recheck the PR is still open before publishing

    # A separate, unprotected environment from github-pages: that
    # environment's branch policy permits deployments only from main.
    environment:
      name: github-pages-preview
      url: ${{ needs.resolve-preview-pr.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js and cache npm dependencies
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm clean-install

      - name: Build web application bundle for this preview
        run: npm run build
        env:
          PAGES_BASE_PATH: /cribbage-trainer/pr/${{ needs.resolve-preview-pr.outputs.number }}
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}

      # The eligibility check ran before the several-minute build-and-test gate;
      # if the PR closed in that window, publishing would recreate a preview
      # that the cleanup workflow already removed (or is about to remove).
      - id: recheck
        name: Confirm the pull request is still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh pr view "${{ needs.resolve-preview-pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
          if [ "$STATE" = "OPEN" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pull request #${{ needs.resolve-preview-pr.outputs.number }} is $STATE; skipping preview publish."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish preview content and deploy
        if: steps.recheck.outputs.open == 'true'
        uses: ./.github/actions/publish-pages-content
        with:
          merge-args: pr ${{ needs.resolve-preview-pr.outputs.number }} dist
          commit-message: Publish pr/${{ needs.resolve-preview-pr.outputs.number }} preview
