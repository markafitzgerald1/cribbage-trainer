name: Publish Pages content
description: >-
  Applies a scoped mutation (production replace, PR preview publish, or PR
  preview removal) to the persistent pages-content state branch, then
  deploys the resulting merged tree to GitHub Pages. The pages-content
  branch is a git-based cache between ephemeral runners, not the Pages
  publishing source itself; it stores the production site root plus a
  pr/<number>/ directory per currently-open preview. A single commit is
  kept and amended in place on every publish so the branch's history and
  storage never grow.
inputs:
  merge-args:
    description: >-
      Arguments passed to scripts/pagesContentMerge.mjs, e.g. "prod dist",
      "pr 123 dist", or "remove 123". The checkout directory is appended
      automatically.
    required: true
  commit-message:
    description: Commit message recorded on the pages-content state branch.
    required: true
  prune-keep-prs:
    description: >-
      When set to "none" or a space-separated list of open PR numbers,
      preview directories for any other PR are removed before deploying.
      Used by production publishes, since merged PRs get no close-event
      cleanup (it would race the merge's own deploy in the pages-deploy
      concurrency group). Empty (the default) skips pruning.
    required: false
    default: ""
outputs:
  page_url:
    description: The root URL of the deployed GitHub Pages site.
    value: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Check out persistent Pages content store
      shell: bash
      run: |
        git fetch origin pages-content || true
        if git show-ref --verify --quiet refs/remotes/origin/pages-content; then
          git worktree add pages-content-checkout pages-content
        else
          git worktree add --detach pages-content-checkout
          git -C pages-content-checkout checkout --orphan pages-content
          git -C pages-content-checkout rm -rf --quiet .
        fi

    - name: Apply content mutation
      shell: bash
      run: node scripts/pagesContentMerge.mjs ${{ inputs.merge-args }} pages-content-checkout

    - name: Prune previews for PRs that are no longer open
      if: inputs.prune-keep-prs != ''
      shell: bash
      run: |
        KEEP="${{ inputs.prune-keep-prs }}"
        if [ "$KEEP" = "none" ]; then
          KEEP=""
        fi
        # Word-splitting KEEP into one argument per PR number is intended.
        # shellcheck disable=SC2086
        node scripts/pagesContentMerge.mjs prune pages-content-checkout $KEEP

    - name: Refuse to deploy a tree that would take production down
      shell: bash
      run: node scripts/pagesContentMerge.mjs assert-deployable pages-content-checkout

    - name: Commit and push the content store
      shell: bash
      working-directory: pages-content-checkout
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add --all
        if git diff --cached --quiet && git rev-parse HEAD > /dev/null 2>&1; then
          echo "No content changes to publish."
        elif git rev-parse HEAD > /dev/null 2>&1; then
          git commit --quiet --amend --message "${{ inputs.commit-message }}"
          git push --force origin HEAD:pages-content
        else
          git commit --quiet --message "${{ inputs.commit-message }}"
          git push --force origin HEAD:pages-content
        fi

    # The name carries the run attempt because deploy-pages refuses a run
    # holding two artifacts of the name it looks up, and a re-run of this
    # job uploads into the same run as the attempt it replaces.
    - id: upload
      name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        name: github-pages-attempt-${{ github.run_attempt }}
        path: pages-content-checkout/

    # deploy-pages finds the artifact by listing the run's artifacts once,
    # and has no input that takes the uploaded ID instead. That listing has
    # come back without an artifact finalized a second earlier, so wait for
    # the exact upload to be listed rather than for a fixed time.
    - name: Wait until the uploaded artifact is listed for this run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        ARTIFACT_NAME: github-pages-attempt-${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
        TIMEOUT_SECONDS: "180"
      run: |
        deadline=$((SECONDS + TIMEOUT_SECONDS))
        while true; do
          if listed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=$ARTIFACT_NAME" \
            --jq '[.artifacts[].id | tostring] | join(" ")' 2>&1); then
            if [ "$listed" = "$ARTIFACT_ID" ]; then
              echo "Artifact $ARTIFACT_NAME (ID $ARTIFACT_ID) is listed for run $RUN_ID."
              exit 0
            fi
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::Artifact $ARTIFACT_NAME (ID $ARTIFACT_ID) was not listed alone for run $RUN_ID within ${TIMEOUT_SECONDS}s. Last listing: ${listed:-none}"
            exit 1
          fi
          sleep 5
        done

    # The poll above reads the public REST API, while deploy-pages lists
    # through the Actions results service, so the poll alone cannot promise
    # that deploy-pages sees the artifact. One retry covers that gap. It
    # cannot race the first attempt, because deploy-pages exits only once a
    # deployment it created has failed or been cancelled by it.
    - id: deploy
      name: Deploy GitHub Pages site
      continue-on-error: true
      uses: actions/deploy-pages@v5
      with:
        token: ${{ github.token }}
        artifact_name: github-pages-attempt-${{ github.run_attempt }}

    - name: Wait before retrying the deploy
      if: steps.deploy.outcome == 'failure'
      shell: bash
      run: sleep 30

    - id: deploy-retry
      name: Retry deploying GitHub Pages site
      if: steps.deploy.outcome == 'failure'
      uses: actions/deploy-pages@v5
      with:
        token: ${{ github.token }}
        artifact_name: github-pages-attempt-${{ github.run_attempt }}
